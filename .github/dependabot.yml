version: 2
updates:
  # .NET dependencies — weekly; minors/patches grouped into one PR.
  # Microsoft.ML.OnnxRuntime majors are IGNORED: the ORT version is coupled to
  # the InferenceEngine.ROCm.Runtime.linux-x64 native couplet (downstream
  # inference-engine-rocm) and must be upgraded as a coordinated release.
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "Microsoft.ML.OnnxRuntime"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.ML.OnnxRuntime.DirectML"
        update-types: ["version-update:semver-major"]
      - dependency-name: "InferenceEngine.ROCm.Runtime.linux-x64"
        # pinned to the public ORT couplet — bump only via coordinated release
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # Keep GitHub Actions pinned-SHA references current (security-relevant).
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions-updates:
        update-types: ["minor", "patch"]
