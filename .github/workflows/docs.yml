name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  contents: read
  packages: read  # private GitHub Packages feed: InferenceEngine.ROCm.Runtime.linux-x64 (until downstream's nuget.org publish)

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build DocFX site
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore DocFX tool (pinned in dotnet-tools.json)
        run: dotnet tool restore

      # docfx metadata builds the project via MSBuild to extract XML docs, so the
      # private GitHub Packages feed (InferenceEngine.ROCm.Runtime.linux-x64) must
      # be reachable: restore explicitly first for clear failures.
      - name: Restore InferenceEngine.Core
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore InferenceEngine.Core/InferenceEngine.Core.csproj --locked-mode

      - name: Generate API metadata
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet docfx docfx.json --metadata

      # Clean curated set: --warningsAsErrors holds. Known exceptions are demoted
      # in docfx.json (rules.InvalidFileLink = suggestion) for the inherited guides'
      # repo-context links (README, plan_docs, example sources) that have no site
      # counterpart — they remain visible in the build log as suggestions.
      - name: Build site (warnings as errors)
        run: dotnet docfx docfx.json --warningsAsErrors

      # Coverage is only generated for site deployments (push to main / manual
      # dispatch); PR builds preview the docs without the (slow) test leg.
      - name: Run tests with coverage
        if: github.event_name != 'pull_request'
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          dotnet test InferenceEngine.Tests --configuration Release
          --filter "FullyQualifiedName!~FaceDetectionEngineTests&FullyQualifiedName!~NativeLibraryValidationTests"
          --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        if: github.event_name != 'pull_request'
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report and embed in site
        if: github.event_name != 'pull_request'
        run: |
          reportgenerator \
            -reports:"InferenceEngine.Tests/TestResults/**/coverage.cobertura.xml" \
            -targetdir:"_site/coverage" \
            -reporttypes:Html
          ls _site/coverage/index.html

      # Best-effort preview: PR docs verdict comes from the build step above —
      # a quota-blocked preview upload must not fail the PR.
      - name: Upload site preview artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        with:
          name: docs-site-preview
          path: _site/
          retention-days: 7

      - name: Upload site artifact for deployment
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-site
          path: _site/
          retention-days: 7

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    needs: [build-docs]
    if: github.ref_name == 'main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    permissions:
      pages: write
      id-token: write
      contents: read

    concurrency:
      group: pages
      cancel-in-progress: true

    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Download site artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-site
          path: _site

      # Inlined equivalent of actions/upload-pages-artifact (its composite body
      # references upload-artifact by tag, which this repo's full-SHA pinning
      # policy rejects): tar the site and upload as the `github-pages` artifact
      # that deploy-pages expects (artifact.tar, uncompressed, dereferenced).
      - name: Package site artifact (github-pages artifact.tar contract)
        run: tar --dereference --directory _site -cf artifact.tar .

      - name: Upload Pages artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-pages
          path: artifact.tar
          retention-days: 1

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
