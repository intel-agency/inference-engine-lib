name: Build & Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      UPLOAD_ARTIFACTS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          upload-artifacts: ${{ env.UPLOAD_ARTIFACTS }}
          artifact-retention-days: '7'
          artifact-name: build-output-${{ matrix.os }}
