name: Build & Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Build and Test
        uses: ./.github/actions/build-and-test@main
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          nuget-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifacts: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'true' || 'false' }}
          artifact-retention-days: '7'
          artifact-name: build-output-${{ matrix.os }}
