name: Build & Test

on:
  push:
    branches: [main, development, release]
  pull_request:
    branches: [main, development, release]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Stage 1: Compile ─────────────────────────────────────────────────────
  # fail-fast: true — if any platform fails to compile, abort immediately.
  # No point running tests if the code doesn't build.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore
        shell: bash

      - name: Build Release
        run: dotnet build --configuration Release --no-restore
        shell: bash

  # ── Stage 2: Test ─────────────────────────────────────────────────────────
  # fail-fast: false — we want all platform test results even if one platform
  # fails (distinguishes a platform-specific failure from a general one).
  # Gates on: build (all platforms must compile before any tests run).
  # Note: test stage does its own `dotnet build` (no artifact download) to avoid
  # the GitHub Actions artifact storage quota, which previously failed CI runs
  # with "Artifact storage quota has been hit" on the upload step.
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    # NOTE (T6): the GPU/MIGraphX provider tests (SkippableFact gated on /dev/kfd +
    # libamdhip64.so.7 + libmigraphx_c.so.3) always SKIP on GitHub-hosted runners because those
    # native runtimes are not installed there. To actually exercise the MIGraphX append/fallback
    # paths, run this test job additionally on a self-hosted Linux-x64 ROCm runner that has the AMD
    # ROCm stack (hip-runtime-amd + migraphx) installed, and wire that runner's results as a required
    # status check on `main`, `development`, and `release`.
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore
        shell: bash

      - name: Build Release
        run: dotnet build --configuration Release --no-restore
        shell: bash

      - name: Run tests with coverage
        run: >
          dotnet test --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName!~NativeLibraryValidationTests"
          --collect:"XPlat Code Coverage"
        shell: bash

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.5.11
        shell: bash

      - name: Generate coverage report
        run: >
          reportgenerator
          -reports:"InferenceEngine.Tests/TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage-report"
          -reporttypes:"Html;MarkdownSummaryGithub"
        shell: bash

      # Best-effort: the org's Actions artifact storage runs near its quota
      # (see plan_docs + the June fix/ci-artifact-quota incident). Reports are
      # ephemeral CI byproducts — the durable coverage home is the Pages site —
      # so a quota-blocked upload must not fail test gating. Retention kept low.
      - name: Upload test results and coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        continue-on-error: true
        with:
          name: test-results-${{ runner.os }}
          path: |
            InferenceEngine.Tests/TestResults/
            coverage-report/
          retention-days: 7

  # ── Stage 3: PR coverage comment ────────────────────────────────────────────
  # Posts/updates the MarkdownSummaryGithub coverage summary as a PR comment.
  # ubuntu-24.04 is the coverage authority; only that OS leg produces the
  # summary the comment embeds. Re-runs update the SAME comment in place
  # (found via the <!-- coverage-summary --> marker) instead of stacking new
  # comments on every push.
  coverage-comment:
    name: Coverage comment
    runs-on: ubuntu-24.04
    needs: [test]
    if: github.event_name == 'pull_request'
    # Informational only: when a quota-blocked upload left no artifact to
    # download, this job must not gate the PR — test jobs already did.
    continue-on-error: true

    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Find existing coverage comment
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-contains: <!-- coverage-summary -->

      - name: Download ubuntu coverage report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: test-results-Linux
          path: coverage-artifact

      - name: Build comment body
        run: |
          {
            echo '<!-- coverage-summary -->'
            echo '## Coverage summary'
            echo ''
            cat coverage-artifact/coverage-report/SummaryGithub.md
          } > comment-body.md
          echo '--- comment body ---'
          cat comment-body.md

      # Fork PRs run with a read-only GITHUB_TOKEN (no pull-requests: write),
      # so the comment step cannot post there — don't let that fail the job.
      # Same-repo branch PRs (the CONTRIBUTING.md flow) always have the scope.
      - name: Create or update coverage comment
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4
        continue-on-error: true
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-path: comment-body.md
          edit-mode: replace
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
