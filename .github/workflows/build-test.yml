name: Build & Test

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  # ── Stage 1: Compile ─────────────────────────────────────────────────────
  # fail-fast: true — if any platform fails to compile, abort immediately.
  # No point running tests if the code doesn't build.
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore
        shell: bash

      - name: Build Release
        run: dotnet build --configuration Release --no-restore
        shell: bash

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-artifacts-${{ matrix.os }}
          # Framework-dependent build output (`dotnet build` without --runtime). The
          # net10.0 subfolder is where the test stage runs `dotnet test --no-build`.
          # Excludes NuGet restore caches, symbols, and ref assemblies that bloated
          # the previous bin/Release/ upload to 150+ MB per platform.
          path: |
            InferenceEngine.Core/bin/Release/net10.0/
            InferenceEngine.Tests/bin/Release/net10.0/
            InferenceEngine.Core.IntegrationTests/bin/Release/net10.0/
          retention-days: 1

  # ── Stage 2: Test ─────────────────────────────────────────────────────────
  # fail-fast: false — we want all platform test results even if one platform
  # fails (distinguishes a platform-specific failure from a general one).
  # Gates on: build (all platforms must compile before any tests run).
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-artifacts-${{ matrix.os }}

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore
        shell: bash

      - name: Run tests with coverage
        run: >
          dotnet test --configuration Release --no-build --verbosity normal
          --filter "FullyQualifiedName!~FaceDetectionEngineTests&FullyQualifiedName!~NativeLibraryValidationTests"
          --collect:"XPlat Code Coverage"
        shell: bash

      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.2.0
        shell: bash

      - name: Generate HTML coverage report
        run: >
          reportgenerator
          -reports:"InferenceEngine.Tests/TestResults/**/coverage.cobertura.xml"
          -targetdir:"coverage-report"
          -reporttypes:Html
        shell: bash

      - name: Upload test results and coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results-${{ runner.os }}
          path: |
            InferenceEngine.Tests/TestResults/
            coverage-report/
          retention-days: 30

  # ── Stage 3: Persist artifacts (main branch only) ─────────────────────────
  # Gates on: test. Long-term artifacts only saved when all tests pass on main.
  # Removed the duplicate build-output-* re-upload (was consuming ~170 MB per run for
  # artifacts nobody downloaded). Use the 1-day build-artifacts-* above for debugging.
  save-artifacts:
    name: Save Long-Term Artifacts
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: No-op (long-term build artifacts removed to stay under storage quota)
        run: echo "Long-term artifact persistence removed; see workflow history for rationale."
