# Org-standard secret scanning (owner-approved 2026-10-23; designed to replace
# GHAS Secret Protection if the org leaves the Enterprise trial — the GitHub-
# native push protection stays enabled during the trial as defense in depth).
#   Gate  : gitleaks pattern-scans FULL history on every PR and default-branch
#           push — wire job "gitleaks" as a required check to block merges.
#   Local : .pre-commit-config.yaml blocks commits at git-commit time.
#   Sweep : trufflehog verifies candidate secrets against provider APIs
#           (live-key detection) — weekly + manual only, so PRs stay fast.
# Intentional test secrets: add a .gitleaks.toml with [extend] useDefault=true plus a NON-EMPTY
# [allowlist] (gitleaks rejects empty allowlists). Never disable this check.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "57 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned v8.30.1)
        run: |
          set -euo pipefail
          curl -sSLo gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan full git history
        run: gitleaks git --redact --verbose .

  trufflehog:
    name: trufflehog-verified-sweep
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install trufflehog (pinned v3.99.4)
        run: |
          set -euo pipefail
          curl -sSLo thog.tar.gz \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v3.99.4/trufflehog_3.99.4_linux_amd64.tar.gz"
          echo "5ae9b313342d1bfa96404064c0f59e77a2cbd1824d797ca7b11e6655aa8fd9d1  thog.tar.gz" | sha256sum -c -
          tar -xzf thog.tar.gz trufflehog
          install -m 0755 trufflehog /usr/local/bin/trufflehog
      - name: Sweep history for verified-live secrets
        run: trufflehog git --only-verified --redact file://"$(pwd)"
