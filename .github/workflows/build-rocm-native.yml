name: Build ROCm Native Libraries

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Retention period for ROCm native library artifacts.
        required: false
        type: number
        default: 30

jobs:
  build-rocm-native:
    name: Build ROCm native artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build ROCm native libraries
        shell: bash
        run: |
          set -euo pipefail
          echo "ROCm native build started: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          ./scripts/build-rocm-native.sh
          echo "ROCm native build completed: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

      # Level 1 validation: ensure expected artifacts exist.
      - name: Validate ROCm artifact existence
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "build/linux-x64/native/libonnxruntime.so" ]]; then
            echo "ERROR: Missing build/linux-x64/native/libonnxruntime.so"
            exit 1
          fi

          if [[ ! -f "build/linux-x64/native/libonnxruntime_providers_rocm.so" ]]; then
            echo "ERROR: Missing build/linux-x64/native/libonnxruntime_providers_rocm.so"
            exit 1
          fi

          echo "Artifact existence validation passed."

      # Level 1 validation: guard expected minimum binary sizes for ROCm build outputs.
      - name: Validate ROCm artifact sizes
        shell: bash
        run: |
          set -euo pipefail

          ort_size=$(stat -c%s build/linux-x64/native/libonnxruntime.so)
          rocm_provider_size=$(stat -c%s build/linux-x64/native/libonnxruntime_providers_rocm.so)

          echo "libonnxruntime.so size: ${ort_size} bytes"
          echo "libonnxruntime_providers_rocm.so size: ${rocm_provider_size} bytes"

          if (( ort_size < 10485760 )); then
            echo "ERROR: libonnxruntime.so size below minimum threshold (10485760)."
            exit 1
          fi

          if (( rocm_provider_size < 52428800 )); then
            echo "ERROR: libonnxruntime_providers_rocm.so size below minimum threshold (52428800)."
            exit 1
          fi

          echo "Artifact size validation passed."

      # Level 1 validation: verify Linux ELF shared object headers.
      - name: Validate ROCm ELF headers
        shell: bash
        run: |
          set -euo pipefail

          ort_file_output=$(file build/linux-x64/native/libonnxruntime.so)
          rocm_file_output=$(file build/linux-x64/native/libonnxruntime_providers_rocm.so)

          echo "$ort_file_output"
          echo "$rocm_file_output"

          if [[ "$ort_file_output" != *"ELF 64-bit LSB shared object"* ]]; then
            echo "ERROR: Invalid ELF header for libonnxruntime.so."
            exit 1
          fi

          if [[ "$rocm_file_output" != *"ELF 64-bit LSB shared object"* ]]; then
            echo "ERROR: Invalid ELF header for libonnxruntime_providers_rocm.so."
            exit 1
          fi

          echo "ELF header validation passed."

      - name: Upload ROCm native libraries
        uses: actions/upload-artifact@v4
        with:
          name: rocm-native-libs
          path: build/linux-x64/native/*.so
          retention-days: ${{ inputs.artifact-retention-days }}
