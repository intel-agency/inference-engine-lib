name: Validate ROCm Build

on:
  push:
    branches: [development, main]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  validate-rocm:
    name: Build ROCm native artifacts
    uses: ./.github/workflows/build-rocm-native.yml
    with:
      artifact-retention-days: 7

  verify-rocm-artifacts:
    name: Verify ROCm artifacts
    runs-on: ubuntu-latest
    needs: validate-rocm

    steps:
      - name: Download ROCm native libraries
        uses: actions/download-artifact@v4
        with:
          name: rocm-native-libs
          path: build/linux-x64/native/

      - name: Log validation success
        shell: bash
        run: |
          set -euo pipefail
          ls -lah build/linux-x64/native/
          stat -c '%n %s bytes' \
            build/linux-x64/native/libonnxruntime.so \
            build/linux-x64/native/libonnxruntime_providers_rocm.so
          echo "ROCm build validation completed successfully."

  validate-native:
    name: Run Tier-1 native validation tests
    runs-on: ubuntu-latest
    needs: validate-rocm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download ROCm native libraries
        uses: actions/download-artifact@v4
        with:
          name: rocm-native-libs
          path: native-libs

      - name: Run Tier-1 validation tests
        env:
          NATIVE_LIBS_DIR: ${{ github.workspace }}/native-libs
        run: |
          dotnet test InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --logger "console;verbosity=normal"
