name: Publish NuGet

on:
  push:
    branches: [development, main, release]
    paths:
      - 'InferenceEngine.Core/**'
      - 'InferenceEngine.Examples/**'
      - '.github/workflows/publish.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: 'https://nuget.pkg.github.com/intel-agency/index.json'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    outputs:
      artifact-name: build-output-${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          nuget-token: ${{ secrets.GITHUB_TOKEN }}
          upload-artifacts: 'true'
          artifact-retention-days: '30'
          artifact-name: build-output-${{ matrix.os }}

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test]
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output-ubuntu-latest
          path: .
      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore

      - name: Compute Package Version
        id: version
        run: |
          PREFIX="${{ vars.VERSION_PREFIX }}"
          RUN="${{ github.run_number }}"
          case "${{ github.ref_name }}" in
            development) VERSION="${PREFIX}-dev.${RUN}" ;;
            staging)     VERSION="${PREFIX}-rc.${RUN}" ;;
            release)     VERSION="${PREFIX}.${RUN}" ;;
            *)           VERSION="${PREFIX}-local.${RUN}" ;;
          esac
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"
      - name: Pack NuGet Package
        run: |
          echo "Packing version: ${{ steps.version.outputs.value }}"
          dotnet pack InferenceEngine.Core/InferenceEngine.Core.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version=${{ steps.version.outputs.value }}
        
      - name: Upload NuGet Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          retention-days: 30

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [pack]
    if: success()
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: ./nupkg
          
      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            ${{ env.REGISTRY }}
            
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source github \
            --skip-duplicate
          dotnet nuget push "./nupkg/*.snupkg" \
            --source github \
            --skip-duplicate

  publish-nuget-org:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [pack]
    if: success() && github.ref_name == 'release' && vars.PUBLISH_NUGET_ORG == 'true'
    environment:
      name: nuget-org
      url: https://www.nuget.org/packages/InferenceEngine.Core
      
    steps:
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: ./nupkg
          
      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "./nupkg/*.snupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
