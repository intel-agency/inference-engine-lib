name: Publish NuGet

on:
  push:
    branches: [release]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: 'https://nuget.pkg.github.com/intel-agency/index.json'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    outputs:
      artifact-name: build-output-${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          upload-artifacts: 'true'
          artifact-retention-days: '30'
          artifact-name: build-output-${{ matrix.os }}

  build-rocm-native:
    name: Build ROCm Native Libraries
    uses: ./.github/workflows/build-rocm-native.yml

  pack:
    name: Pack NuGet
    runs-on: ubuntu-latest
    needs: [build-and-test, build-rocm-native]
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: build-output-ubuntu-latest
          path: .

      - name: Download ROCm Native Libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rocm-native-libs
          path: InferenceEngine.Core/runtimes/linux-x64/native/

      - name: Verify ROCm Artifacts Placement
        shell: bash
        run: |
          set -euo pipefail
          ls -lah InferenceEngine.Core/runtimes/linux-x64/native/

          if [[ ! -f "InferenceEngine.Core/runtimes/linux-x64/native/libonnxruntime.so" ]]; then
            echo "ERROR: Missing InferenceEngine.Core/runtimes/linux-x64/native/libonnxruntime.so"
            exit 1
          fi

          if [[ ! -f "InferenceEngine.Core/runtimes/linux-x64/native/libonnxruntime_providers_rocm.so" ]]; then
            echo "ERROR: Missing InferenceEngine.Core/runtimes/linux-x64/native/libonnxruntime_providers_rocm.so"
            exit 1
          fi

          # Additional .so files (for example libonnxruntime_providers_shared.so) may be present and are expected.
          stat -c '%n %s bytes' InferenceEngine.Core/runtimes/linux-x64/native/*.so || true
          echo "All ROCm artifacts verified successfully."
          
      - name: Pack NuGet Package
        run: |
          VERSION="${{ vars.VERSION_PREFIX }}.${{ github.run_number }}"
          echo "Building version: $VERSION"
          dotnet pack InferenceEngine.Core/InferenceEngine.Core.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version=$VERSION
        
      - name: Upload NuGet Package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-package
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          retention-days: 30

  validate-native:
    name: Validate ROCm native libraries
    runs-on: ubuntu-latest
    needs: [pack, build-rocm-native]
    if: success()

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download ROCm native libraries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rocm-native-libs
          path: native-libs

      - name: Run Tier-1 validation tests
        env:
          NATIVE_LIBS_DIR: ${{ github.workspace }}/native-libs
        run: |
          dotnet test InferenceEngine.Core.IntegrationTests/InferenceEngine.Core.IntegrationTests.csproj \
            --configuration Release \
            --runtime linux-x64 \
            --logger "console;verbosity=normal"

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    needs: [pack, validate-native]
    if: success()
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: ./nupkg
          
      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            ${{ env.REGISTRY }}
            
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source github \
            --skip-duplicate

  publish-nuget-org:
    name: Publish to NuGet.org
    runs-on: ubuntu-latest
    needs: [pack, validate-native]
    if: success()
    environment:
      name: nuget-org
      url: https://www.nuget.org/packages/InferenceEngine.Core
      
    steps:
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download NuGet Package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-package
          path: ./nupkg
          
      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
