name: Publish NuGet

on:
  push:
    branches: [development, main, release]
    paths:
      - 'InferenceEngine.Core/**'
      - 'InferenceEngine.Examples/**'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  REGISTRY: 'https://nuget.pkg.github.com/intel-agency/index.json'

# Least privilege default for all jobs; jobs needing more (publish-github-packages,
# create-release) override this with their own job-level permissions block.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          nuget-token: ${{ secrets.GITHUB_TOKEN }}
          # No cross-job build-artifact handoff: the pack job builds for itself.
          # Large artifacts (Core bin with native libs, per OS) repeatedly hit the
          # org's Actions storage quota and failed this pipeline's uploads — same
          # class as the June fix/ci-artifact-quota incident. Test-result uploads
          # inside the action remain best-effort.
          upload-artifacts: 'false'

  pack:
    name: Pack NuGet
    runs-on: ubuntu-24.04
    needs: [build-and-test]
    if: success()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # Build in-job instead of downloading the ubuntu build-output artifact:
      # the handoff was the pipeline's largest storage liability and failed
      # outright whenever the org artifact quota was exhausted.
      - name: Restore dependencies
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet restore --locked-mode

      - name: Build Release
        run: dotnet build InferenceEngine.Core/InferenceEngine.Core.csproj --configuration Release --no-restore

      - name: Compute Package Version
        id: version
        env:
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          PREFIX="$VERSION_PREFIX"
          RUN="$RUN_NUMBER"
          case "$REF_NAME" in
            development) VERSION="${PREFIX}-dev.${RUN}" ;;
            main)        VERSION="${PREFIX}-rc.${RUN}" ;;
            release)     VERSION="${PREFIX}.${RUN}" ;;
            *)           VERSION="${PREFIX}-local.${RUN}" ;;
          esac
          echo "value=$VERSION" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION"
      - name: Pack NuGet Package
        run: |
          echo "Packing version: ${{ steps.version.outputs.value }}"
          dotnet pack InferenceEngine.Core/InferenceEngine.Core.csproj \
            --configuration Release \
            --no-build \
            --output ./nupkg \
            -p:Version=${{ steps.version.outputs.value }}
        
      - name: Upload NuGet Package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: |
            ./nupkg/*.nupkg
            ./nupkg/*.snupkg
          retention-days: 7

  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-24.04
    needs: [pack]
    if: success()
    permissions:
      packages: write
      contents: read
      
    steps:
      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          
      - name: Download NuGet Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: ./nupkg
          
      - name: Configure GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            ${{ env.REGISTRY }}
            
      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source github \
            --skip-duplicate
          dotnet nuget push "./nupkg/*.snupkg" \
            --source github \
            --skip-duplicate

  # Release-only final stage (mirrors downstream build-rocm-linux.yml): after the
  # packages have landed on GitHub Packages, cut the GitHub Release and push to
  # nuget.org. Gated by the protected `release` environment, not a toggle variable.
  create-release:
    name: Create GitHub Release & Publish to NuGet.org
    needs: [publish-github-packages]
    if: github.ref_name == 'release'
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write  # GitHub OIDC — required for nuget.org trusted publishing
      attestations: write  # build-provenance attestations for shipped nupkgs

    steps:
      # nuget.org trusted publishing (keyless): exchange this job's GitHub OIDC
      # token for a 1-hour API key, validated against the nuget.org policy
      # (owner intel-agency / repo inference-engine-lib / workflow
      # publish-nuget.yml / environment release — policy owner: intel-agent).
      # OIDC-only as of 2026-10-21: two consecutive clean keyless releases
      # (1.2.17, 1.2.25) proven; the classic NUGET_API_KEY fallback was removed
      # per MEDIUM-3 and the nuget.org key + repo secret can be retired.
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: intel-agent

      - name: Verify OIDC key obtained
        env:
          OIDC_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          if [ -z "$OIDC_KEY" ]; then
            echo "::error::OIDC exchange returned no key — check the nuget.org trusted publishing policy"
            exit 1
          fi
          echo "NUGET_PUSH_KEY=$OIDC_KEY" >> "$GITHUB_ENV"

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download NuGet Package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: ./nupkg

      - name: Compute Release Version
        env:
          VERSION_PREFIX: ${{ vars.VERSION_PREFIX }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          PREFIX="$VERSION_PREFIX"
          RUN="$RUN_NUMBER"
          VERSION="${PREFIX}.${RUN}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Release version: $VERSION"

      # Bare filenames so `sha256sum -c SHA256SUMS.txt` works in a flat
      # download dir — generate from inside nupkg/.
      - name: Generate checksums
        run: |
          cd nupkg
          sha256sum -- *.nupkg *.snupkg > SHA256SUMS.txt
          echo "=== SHA256SUMS ==="
          cat SHA256SUMS.txt

      # Sigstore keyless signatures for the exact release bytes. Satisfies the
      # Scorecard Signed-Releases check (it counts signature files among the
      # release assets — attestations alone don't register) and gives consumers
      # offline-verifiable signatures alongside the existing build provenance.
      # cosign is NOT on the ubuntu-24.04 runner image — install it explicitly
      # (the "preinstalled" assumption failed the first release publish after
      # this step landed, exit 127). Keyless signing uses this job's OIDC
      # token (id-token: write, granted above).
      - name: Install cosign
        uses: sigstore/cosign-installer@d58896d6a1865668819e1d91763c7751a165e159 # v3.9.2

      - name: Sign release artifacts (sigstore keyless)
        run: |
          cd nupkg
          cosign version
          for f in *.nupkg *.snupkg SHA256SUMS.txt; do
            cosign sign-blob --yes --output-signature "$f.sig" --bundle "$f.bundle" "$f"
          done
          echo "=== signatures ==="
          ls -la *.sig *.bundle

      # NOTE: releases in this repo are immutable — once published, a version's
      # TAG NAME IS BURNED PERMANENTLY (deleting the release does not free it:
      # "tag_name was used by an immutable release", hit on v1.2.10). So a failed
      # publish cannot be retried at the same version at all. This step only
      # clears a stale DRAFT/unpublished release object (e.g. from a partial
      # run); the documented recovery for a failed publish is to dispatch a
      # FRESH workflow run, which packs the next run-number version.
      - name: Remove stale release for this version
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "v$VERSION" --cleanup-tag --yes || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.VERSION }}
          name: "v${{ env.VERSION }}"
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            nupkg/*.nupkg
            nupkg/*.snupkg
            nupkg/SHA256SUMS.txt
            nupkg/*.sig
            nupkg/*.bundle
          body: |
            ### Verifying artifacts

            Checksums: `sha256sum -c SHA256SUMS.txt`

            Signatures (sigstore keyless): every artifact ships a `<name>.sig` + `<name>.bundle` pair. Verify with:

            ```
            cosign verify-blob \
              --bundle <artifact>.bundle \
              --certificate-identity-regexp "https://github\.com/intel-agency/inference-engine-lib/" \
              --certificate-oidc-issuer "https://token\.actions\.githubusercontent\.com" \
              <artifact>
            ```

            Build provenance (SLSA): `gh attestation verify <artifact> -R intel-agency/inference-engine-lib`

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push "./nupkg/*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_PUSH_KEY" \
            --skip-duplicate
          dotnet nuget push "./nupkg/*.snupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_PUSH_KEY" \
            --skip-duplicate

      # SLSA-style build provenance for the exact bytes pushed to nuget.org —
      # verifiable by anyone: gh attestation verify <nupkg> -R intel-agency/inference-engine-lib
      - name: Attest build provenance (nupkg/snupkg)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            nupkg/*.nupkg
            nupkg/*.snupkg
